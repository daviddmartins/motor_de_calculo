name: Testes do Motor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Compilação
        run: python -m compileall -q app.py core services ui
      - name: Testes
        run: pytest -q
